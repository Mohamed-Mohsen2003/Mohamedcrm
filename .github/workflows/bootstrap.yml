name: bootstrap
on: push
permissions:
  contents: write
jobs:
  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm ls --depth=0 > versions.txt || true
      - run: |
          tar czf deps.tgz node_modules
          mkdir out && split -b 80m deps.tgz out/deps.part.
          cp package-lock.json versions.txt out/
          cd out
          git init -q -b deps-cache
          git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm deps
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deps-cache
